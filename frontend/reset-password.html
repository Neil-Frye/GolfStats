<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolfStats | Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-golf-ball"></i>
                    <span>GolfStats</span>
                </div>
                <h1>Reset Password</h1>
                <p>Enter your email to receive a password reset link</p>
            </div>
            
            <div class="login-methods">
                <form id="reset-password-form" class="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-message success" style="display: none;">
                        <i class="fas fa-check-circle"></i>
                        <span>Password reset email sent! Check your inbox.</span>
                    </div>
                    
                    <div class="form-error" style="display: none;">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Error sending reset email</span>
                    </div>
                    
                    <button type="submit" class="login-btn">Send Reset Link</button>
                </form>
            </div>
            
            <div class="login-footer">
                <p>Remember your password? <a href="/login.html">Sign in</a></p>
            </div>
        </div>
        
        <div class="login-image">
            <img src="https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1170&q=80" alt="Golf course">
            <div class="image-overlay">
                <h2>Recover Your Account</h2>
                <p>Get back to tracking your golf stats and improving your game.</p>
            </div>
        </div>
    </div>
    
    <script src="reset-password.js"></script>
</body>
</html>
