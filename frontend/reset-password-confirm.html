<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolfStats | Set New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-golf-ball"></i>
                    <span>GolfStats</span>
                </div>
                <h1>Set New Password</h1>
                <p>Enter your new password to reset your account</p>
            </div>
            
            <div class="login-methods">
                <form id="reset-password-confirm-form" class="login-form">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" required>
                        <small class="helper-text">Password must be at least 8 characters long</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                    
                    <div class="form-message success" style="display: none;">
                        <i class="fas fa-check-circle"></i>
                        <span>Password reset successful! You may now login.</span>
                    </div>
                    
                    <div class="form-error" style="display: none;">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Error resetting password</span>
                    </div>
                    
                    <button type="submit" class="login-btn">Reset Password</button>
                </form>
            </div>
            
            <div class="login-footer">
                <p>Remember your password? <a href="/login.html">Sign in</a></p>
            </div>
        </div>
        
        <div class="login-image">
            <img src="https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1170&q=80" alt="Golf course">
            <div class="image-overlay">
                <h2>Reset Your Password</h2>
                <p>Create a new password to secure your account.</p>
            </div>
        </div>
    </div>
    
    <script src="reset-password-confirm.js"></script>
</body>
</html>
