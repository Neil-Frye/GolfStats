name: Pull Request Tests - Lightweight Version

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  api-validation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Allow action to comment on PRs
    
    env:
      APP_ENVIRONMENT: test
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      SUPABASE_PASSWORD: ${{ secrets.TEST_SUPABASE_PASSWORD }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install minimal dependencies for API validation
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pylint
    
    - name: Validate API
      run: |
        # Just check if API file has syntax errors
        python -m py_compile api/index.py
        
        # Simple pylint check on the API file only
        pylint api/index.py --disable=all --enable=syntax-error,undefined-variable
    
    - name: Comment PR with API validation
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { issue: { number: issue_number }, repo: { owner, repo } } = context;
          
          github.rest.issues.createComment({
            issue_number,
            owner,
            repo,
            body: `## API Validation Complete\n\nThe serverless API has been validated for syntax errors.\n\nSee [workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) for details.`
          });
