name: Pull Request Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      APP_ENVIRONMENT: test
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      SUPABASE_PASSWORD: ${{ secrets.TEST_SUPABASE_PASSWORD }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pylint mypy pytest pytest-cov
    
    - name: Run linting
      run: |
        pylint backend tests
      continue-on-error: true  # Don't fail the build on linting errors
    
    - name: Run type checking
      run: |
        mypy backend tests
      continue-on-error: true  # Don't fail the build on type errors
    
    - name: Run unit tests
      run: |
        python -m pytest tests -v
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()  # Upload artifacts even if tests fail
      with:
        name: test-results
        path: |
          .pytest_cache/
          .coverage
          htmlcov/
        retention-days: 7
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const { issue: { number: issue_number }, repo: { owner, repo } } = context;
          
          const testResultSummary = process.env.TEST_RESULT_SUMMARY || 'Tests have been run. Check the workflow run for details.';
          
          github.rest.issues.createComment({
            issue_number,
            owner,
            repo,
            body: `## Test Results\n\n${testResultSummary}\n\nSee [workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) for details.`
          });