name: "Daily Golf Data ETL"

on:
  schedule:
    - cron: "0 3 * * *"   # Runs daily at 3:00 AM UTC
  workflow_dispatch:       # Allow manual run from the Actions tab

jobs:
  run-etl:
    runs-on: ubuntu-latest

    # Inject environment variables from GitHub Actions secrets.
    # Each must be configured under Settings -> Secrets -> Actions in your GitHub repo.
    env:
      APP_ENVIRONMENT: production

      # Supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # Scraper Credentials
      TRACKMAN_USERNAME: ${{ secrets.TRACKMAN_USERNAME }}
      TRACKMAN_PASSWORD: ${{ secrets.TRACKMAN_PASSWORD }}
      ARCCOS_EMAIL: ${{ secrets.ARCCOS_EMAIL }}
      ARCCOS_PASSWORD: ${{ secrets.ARCCOS_PASSWORD }}
      SKYTRAK_USERNAME: ${{ secrets.SKYTRAK_USERNAME }}
      SKYTRAK_PASSWORD: ${{ secrets.SKYTRAK_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"  # 3.9 for python version compatibility

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run ETL job
        run: |
          python run.py --etl

      - name: Upload logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: logs/daily_etl.log
          retention-days: 7
